<figure class="dg dg-bb-hold" role="img" aria-label="一个月牙形岩点的轮廓。虚线是它的凸包，凸包减去轮廓剩下的那块是开口。从开口的重心指向岩点重心的方向，就是手该拉的方向。">
  <div class="dg-panel">
    <div class="dg-title">从轮廓猜这个点怎么抓</div>

      </svg>
      <ul>
        <li><b>实心度</b><small>轮廓面积 ÷ 凸包面积。低于 0.86 说明缺了一块，是月牙</small></li>
        <li><b>长宽比</b><small>主成分方向上的跨度比。≥ 2 是长条，长轴接近竖直就是侧拉点</small></li>
        <li><b>尺寸和凸出</b><small>边长不到 6 厘米的是脚点；很大的造型当斜面，可以下压、可以踩</small></li>
      </ul>

  </div>
  <figcaption>图里这个月牙开口朝下，是个反提点：手从下面扣进去往上拉，所以身体得先爬到它旁边才用得上。开口朝上的月牙，算出来的方向正好相反。</figcaption>
</figure>
