<figure class="dg dg-flow" role="img" aria-label="The same stream of pull requests: sent to human review, they pile up at the gate; sent to a checkup that runs in seconds, every one is verified and let through.">
  <div class="dg-panel">
    <div class="dg-title">ONE EVENING · ONE STREAM OF PRS</div>
    <div class="dg-lane">
      <div class="dg-lane-head"><b>People read them</b><span>one at a time</span></div>
      <div class="dg-track dg-track-slow">
        <span class="dg-pile" aria-hidden="true"></span>
        <span class="dg-gate"><em>human review</em></span>
        <i class="dg-dot dg-dot-wait" style="--i:0"></i><i class="dg-dot dg-dot-wait" style="--i:1"></i><i class="dg-dot dg-dot-wait" style="--i:2"></i><i class="dg-dot dg-dot-wait" style="--i:3"></i><i class="dg-dot dg-dot-wait" style="--i:4"></i><i class="dg-dot dg-dot-wait" style="--i:5"></i><i class="dg-dot dg-dot-wait" style="--i:6"></i><i class="dg-dot dg-dot-wait" style="--i:7"></i>
        <i class="dg-dot dg-dot-through"></i>
      </div>
      <div class="dg-lane-foot"><span class="dg-warn">the backlog keeps growing</span><span>few get through</span></div>
    </div>
    <div class="dg-lane">
      <div class="dg-lane-head"><b>Machines verify them</b><span>seconds, on every PR</span></div>
      <div class="dg-track dg-track-fast">
        <span class="dg-gate dg-gate-auto"><em>product checkup</em></span>
        <i class="dg-dot dg-dot-run" style="--i:0"></i><i class="dg-dot dg-dot-run" style="--i:1"></i><i class="dg-dot dg-dot-run" style="--i:2"></i><i class="dg-dot dg-dot-run" style="--i:3"></i><i class="dg-dot dg-dot-run" style="--i:4"></i><i class="dg-dot dg-dot-run" style="--i:5"></i><i class="dg-dot dg-dot-run" style="--i:6"></i><i class="dg-dot dg-dot-run" style="--i:7"></i>
      </div>
      <div class="dg-lane-foot"><span class="dg-ok">every one verified</span><span>as fast as the code is written</span></div>
    </div>
  </div>
  <figcaption>Writing code is no longer the bottleneck. Knowing it's right is. Verification has to keep up with the AI, without a person in the loop.</figcaption>
</figure>
