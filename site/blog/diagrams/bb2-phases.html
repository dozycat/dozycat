<figure class="dg dg-bb2-phases" role="img" aria-label="一次动态跳分成六段：蓄力、蹬伸、腾空、接住、摆荡、找回脚。腾空按抛体运动算，摆荡按有阻尼的摆算，这两段是物理；蓄力和蹬伸是按给定曲线插值出来的。">
  <div class="dg-panel">
    <div class="dg-title">一次跳，拆成六段</div>
    <div class="dg-bb2-steps">
      <div class="dg-bb2-step"><b>蓄力</b><small>手脚都在点上，身体先沉下去。最后 0.12 秒刹住，直接接蹬伸</small><em class="mid">插值</em></div>
      <div class="dg-bb2-step"><b>蹬伸</b><small>从发力位加速到起跳速度。远的那只手先松，近的那只拉到最后</small><em class="mid">插值</em></div>
      <div class="dg-bb2-step"><b>腾空</b><small>重心只受重力，走抛物线。飞多久由“还差多远”决定</small><em class="ok">物理</em></div>
      <div class="dg-bb2-step"><b>接住</b><small>手到点。带着这一刻的速度，算荡到最低点时手上有几倍体重</small><em class="ok">物理</em></div>
      <div class="dg-bb2-step"><b>摆荡</b><small>没有脚，人就是一个摆：荡过手点正下方，再回来</small><em class="ok">物理</em></div>
      <div class="dg-bb2-step"><b>找回脚</b><small>趁荡回来的那一下把脚搭上去，不等它自己停</small><em class="mid">插值</em></div>
    </div>
    <div class="dg-bb-foot"><span>“物理”的三段，复查者一直认可</span><span>“插值”的几段，是每一轮挨批的地方</span></div>
  </div>
  <figcaption>绿色的三段有公式可依。黄色的几段，是照着一条给定的曲线把身体挪过去，手脚再各自去够落点。</figcaption>
</figure>
