name: DozycatPet
options:
  bundleIdPrefix: com.paperboytm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  # 自动更新：直发（非 MAS）版更新器。Xcode 把二进制 Sparkle.framework
  # 嵌进 bundle；scripts/package-dmg.sh 对其 inside-out 签名。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  DozycatPet:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 安装包图标：site/assets/icon.png（懒猫 logo）生成的 asset catalog，
      # logo 换了跑 scripts/make-icon.sh 重做
      - path: Assets/Assets.xcassets
      # 与 iOS 共用：同一只猫、同一套 token、同一份 BYOK 配置与 Keychain 条目，
      # 以及同一个 Rust 内核（UniFFI 绑定）
      - path: ../../ios/Dozycat/Components/CatFace.swift
      - path: ../../ios/Dozycat/DesignSystem/DS.swift
      - path: ../../ios/Dozycat/InfoPlist.xcstrings
      - path: ../../ios/Dozycat/Models/SettingsStore.swift
      - path: ../../ios/Dozycat/Models/LLMClient.swift
      - path: ../../ios/Dozycat/Models/PiAgent.swift
      - path: ../../ios/Dozycat/Core/dozycat_core.swift
    dependencies:
      - framework: ../../ios/Vendor/DozycatCore.xcframework
        embed: false
      - package: Sparkle
        product: Sparkle
    # 自定义 Info.plist：Sparkle 的 SUFeedURL / SUPublicEDKey 不在
    # GENERATE_INFOPLIST_FILE 的白名单里，只能自己写一份。
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 懒猫
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: 懒猫用摄像头判断你在不在屏幕前（只产出在/不在，一张画面都不保存）。
        NSHumanReadableCopyright: © 2026 dozycat
        # 更新清单托管在官网（GitHub Pages）；发布脚本更新这份 appcast.xml。
        SUFeedURL: https://dozycat.github.io/dozycat/appcast.xml
        # EdDSA 公钥：generate_keys 生成，私钥在本机钥匙串（发布者持有）。
        SUPublicEDKey: orMMRU/a20tQnzy6zx9sK+cQ523Xrt/P+ia+vJupHRQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperboytm.dozycat.pet
        # 产物名 dozycat（= CFBundleName，隐私列表/强制退出的短名）；xcodeproj /
        # scheme 仍叫 DozycatPet。改这行要同步改 package-dmg.sh 的 dozycat.app。
        PRODUCT_NAME: dozycat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
