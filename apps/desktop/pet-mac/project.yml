name: DozycatPet
options:
  bundleIdPrefix: com.paperboytm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  # 自动更新：直发（非 MAS）版更新器。Xcode 把二进制 Sparkle.framework
  # 嵌进 bundle；scripts/package-dmg.sh 对其 inside-out 签名。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # 表情识别的推理框架。模型本体只有 222KB（model/emotion/，随 bundle 打包），
  # MLX 静态链进主二进制，Metal 上跑，一次推理毫秒级。
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.31.6"
targets:
  DozycatPet:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 安装包图标：site/assets/icon.png（懒猫 logo）生成的 asset catalog，
      # logo 换了跑 scripts/make-icon.sh 重做
      - path: Assets/Assets.xcassets
      # 与 iOS 共用：同一只猫、同一套 token、同一份 BYOK 配置与 Keychain 条目，
      # 以及同一个 Rust 内核（UniFFI 绑定）
      - path: ../../ios/Dozycat/Components/CatFace.swift
      - path: ../../ios/Dozycat/DesignSystem/DS.swift
      - path: ../../ios/Dozycat/InfoPlist.xcstrings
      - path: ../../ios/Dozycat/Models/SettingsStore.swift
      - path: ../../ios/Dozycat/Models/LLMClient.swift
      - path: ../../ios/Dozycat/Models/PiAgent.swift
      - path: ../../ios/Dozycat/Core/dozycat_core.swift
      # 表情小模型权重（mini-Xception/FER2013，BN 已折叠，见 model/emotion/README.md）
      - path: ../../../model/emotion/emotion_mini_xception.safetensors
        buildPhase: resources
    dependencies:
      - framework: ../../ios/Vendor/DozycatCore.xcframework
        embed: false
      - package: Sparkle
        product: Sparkle
      - package: MLX
        product: MLX
      - package: MLX
        product: MLXNN
    # 自定义 Info.plist：Sparkle 的 SUFeedURL / SUPublicEDKey 不在
    # GENERATE_INFOPLIST_FILE 的白名单里，只能自己写一份。
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 懒猫
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: 懒猫用摄像头判断你在不在屏幕前、心情大概怎么样（只产出在/不在和一个表情标签，模型在本地，一张画面都不保存）。
        NSHumanReadableCopyright: © 2026 dozycat
        # 更新清单托管在官网（GitHub Pages）；发布脚本更新这份 appcast.xml。
        SUFeedURL: https://dozycat.github.io/dozycat/appcast.xml
        # EdDSA 公钥：generate_keys 生成，私钥在本机钥匙串（发布者持有）。
        SUPublicEDKey: orMMRU/a20tQnzy6zx9sK+cQ523Xrt/P+ia+vJupHRQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperboytm.dozycat.pet
        # 产物名 dozycat（= CFBundleName，隐私列表/强制退出的短名）；xcodeproj /
        # scheme 仍叫 DozycatPet。改这行要同步改 package-dmg.sh 的 dozycat.app。
        PRODUCT_NAME: dozycat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "3"
      configs:
        # 屏幕录制授权绑定代码签名。ad-hoc Debug 的 designated requirement 只有
        # 每次构建都变化的 CDHash，会让 TCC 把同一个 bundle 当成新 app；官方
        # 开发机用稳定的 Developer ID，CI 仍可传 CODE_SIGNING_ALLOWED=NO。
        Debug:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: PR5A8VMY8S
          CODE_SIGN_IDENTITY: "Developer ID Application"
        # 正式包由 package-dmg.sh 在嵌入 helper 后 inside-out 重签并公证。
        Release:
          CODE_SIGN_IDENTITY: "-"
          # MLX 静态链接后符号表有 ~14MB，发布件必须剥离（38MB → 24MB）。
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
