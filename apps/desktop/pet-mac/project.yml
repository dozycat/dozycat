name: DozycatPet
options:
  bundleIdPrefix: com.paperboytm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
targets:
  DozycatPet:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 与 iOS 共用：同一只猫、同一套 token、同一份 BYOK 配置与 Keychain 条目，
      # 以及同一个 Rust 内核（UniFFI 绑定）
      - path: ../../ios/Dozycat/Components/CatFace.swift
      - path: ../../ios/Dozycat/DesignSystem/DS.swift
      - path: ../../ios/Dozycat/InfoPlist.xcstrings
      - path: ../../ios/Dozycat/Models/SettingsStore.swift
      - path: ../../ios/Dozycat/Models/LLMClient.swift
      - path: ../../ios/Dozycat/Models/PiAgent.swift
      - path: ../../ios/Dozycat/Core/dozycat_core.swift
    dependencies:
      - framework: ../../ios/Vendor/DozycatCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paperboytm.dozycat.pet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES   # 菜单栏应用，不占 Dock
        INFOPLIST_KEY_CFBundleDisplayName: 懒猫
        # 摄像头在位感知（设置里默认关）：帧过一遍人脸检测即弃，只产出在/不在
        INFOPLIST_KEY_NSCameraUsageDescription: 懒猫用摄像头判断你在不在屏幕前（只产出在/不在，一张画面都不保存）。
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    # 签名发布时打开（iOS target 同步加同名 group）：iOS ↔ macOS 共享同一条
    # Keychain Key，经 iCloud 钥匙串同步。见 docs/MEMORY-SYNC.md「设置与 Key」。
    # entitlements:
    #   path: DozycatPet.entitlements
    #   properties:
    #     keychain-access-groups:
    #       - $(AppIdentifierPrefix)com.paperboytm.dozycat.shared
